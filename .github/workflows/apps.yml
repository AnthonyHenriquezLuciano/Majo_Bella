# MAJOBELLA · Apps (Android)
# Revisa el código de las apps y arma los .apk de la app de clientas y la del estudio.
# Los publica en GitHub → Releases → "app" (enlaces fijos que usa la web para descargar):
#   https://github.com/<usuario>/<repo>/releases/download/app/majobella.apk
#   https://github.com/<usuario>/<repo>/releases/download/app/majobella-estudio.apk
#
# Variables del repositorio (Settings → Secrets and variables → Actions → Variables), todas públicas:
#   SUPABASE_URL        https://thpjpsogcmqkemlxajcm.supabase.co  (respaldo público en ambas apps)
#   SUPABASE_ANON_KEY   clave pública de Supabase (respaldo publicable en apps)
#   EAS_PROJECT_ID_CLIENTE  UUID de Expo para MAJOBELLA Cliente
#   EAS_PROJECT_ID_ESTUDIO  UUID distinto para MAJOBELLA Estudio
# Secretos (Secrets) para firmar con la llave propia del estudio (se crean con tools/android-keystore.sh;
# si faltan, se firma con la llave de prueba pública de React Native):
#   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
name: Apps

on:
  push:
    branches: [main]
    paths: ['apps/**', 'packages/**', 'package.json', 'package-lock.json', '.github/workflows/apps.yml']
  pull_request:
    paths: ['apps/**', 'packages/**']
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publicar los APK en Releases (requiere firma Android propia y pruebas realizadas)'
        type: boolean
        required: true
        default: false

concurrency:
  group: apps-${{ github.ref }}
  cancel-in-progress: true

jobs:
  revisar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Tipos (TypeScript)
        run: npm run typecheck
      - name: Validar configuraciones Expo de ambas apps
        run: |
          node --check apps/cliente/app.config.js
          node --check apps/estudio/app.config.js
      - name: Verificar Firebase por cada app (sin mezclar los JSON)
        run: |
          node - <<'NODE'
          const fs = require('fs');
          for (const [app, pkg] of [['cliente', 'com.majobella.app'], ['estudio', 'com.majobella.estudio']]) {
            const expo = JSON.parse(fs.readFileSync(`apps/${app}/app.json`, 'utf8')).expo;
            const firebase = JSON.parse(fs.readFileSync(`apps/${app}/google-services.json`, 'utf8'));
            const packages = firebase.client.map(x => x.client_info.android_client_info.package_name);
            if (expo.android.package !== pkg || expo.android.googleServicesFile !== './google-services.json' || firebase.project_info.project_id !== 'majobella' || packages.length !== 1 || packages[0] !== pkg) throw Error(`Firebase no coincide con ${app}: ${packages}`);
            console.log(`Firebase validado: ${app} -> ${pkg}`);
          }
          NODE
      - name: Pruebas del código compartido
        run: npx tsx packages/core/test/core.test.ts

  android:
    needs: revisar
    # Push a main: genera APKs de prueba como ARTIFACTOS; nunca publica Releases.
    # Manual: permite generar APKs y, con aprobación y firma privada, publicar Releases.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: cliente
            apk: majobella.apk
          - app: estudio
            apk: majobella-estudio.apk
    env:
      EXPO_PUBLIC_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
      EXPO_PUBLIC_EAS_PROJECT_ID: ${{ matrix.app == 'cliente' && vars.EAS_PROJECT_ID_CLIENTE || vars.EAS_PROJECT_ID_ESTUDIO }}
      PUBLISH_RELEASE: ${{ inputs.publish_release || false }}
      NODE_ENV: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci
      - name: Verificar Supabase y proyecto Expo por app
        run: |
          node -e "const v=process.env; const url=v.EXPO_PUBLIC_SUPABASE_URL || 'https://thpjpsogcmqkemlxajcm.supabase.co'; if(url !== 'https://thpjpsogcmqkemlxajcm.supabase.co') throw Error('URL incorrecta: se detiene la compilación'); const k=v.EXPO_PUBLIC_SUPABASE_ANON_KEY || 'sb_publishable_'; if(!k.startsWith('sb_publishable_') && !k.startsWith('eyJ')) throw Error('No es una clave pública de Supabase'); const id=v.EXPO_PUBLIC_EAS_PROJECT_ID; if (id && !/^[a-f0-9]{8}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{12}$/i.test(id)) throw Error('El ID Expo debe ser UUID'); console.log('API Supabase validada. Proyecto push: '+(id?'configurado':'no configurado (sin push remoto)'));"
      - name: Versión (cada compilación sube el número para poder actualizar sin desinstalar)
        working-directory: apps/${{ matrix.app }}
        run: |
          node -e "
            const f='app.json', j=JSON.parse(require('fs').readFileSync(f,'utf8'));
            j.expo.android.versionCode=Number(process.env.GITHUB_RUN_NUMBER);
            j.expo.version='1.0.'+process.env.GITHUB_RUN_NUMBER;
            require('fs').writeFileSync(f, JSON.stringify(j,null,2));"
      - name: Código nativo de Android (prebuild)
        working-directory: apps/${{ matrix.app }}
        run: npx expo prebuild -p android --no-install --clean
      - name: Compilar
        working-directory: apps/${{ matrix.app }}/android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a
      - name: Firmar
        working-directory: apps/${{ matrix.app }}/android/app/build/outputs/apk/release
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > "$RUNNER_TEMP/release.keystore"
            "$BT/apksigner" sign --ks "$RUNNER_TEMP/release.keystore" --ks-pass env:KS_PASS --key-pass env:KEY_PASS --ks-key-alias "$KEY_ALIAS" --out "$GITHUB_WORKSPACE/${{ matrix.apk }}" app-release.apk
            rm -f "$RUNNER_TEMP/release.keystore"
          else
            if [ "$PUBLISH_RELEASE" = 'true' ]; then echo '::error::No se pueden publicar APKs sin firma propia de Android'; exit 1; fi
            echo "::warning::APK de PRUEBAS firmado con llave de desarrollo; solo artifact, no Releases."
            cp app-release.apk "$GITHUB_WORKSPACE/${{ matrix.apk }}"
          fi
          "$BT/apksigner" verify --print-certs "$GITHUB_WORKSPACE/${{ matrix.apk }}" | head -3
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.apk }}
          path: ${{ matrix.apk }}
          retention-days: 14

  publicar:
    needs: android
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.publish_release == true
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with: { merge-multiple: true }
      - name: Publicar en Releases → app
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          ls -la *.apk
          NOTES="Apps de MAJOBELLA Android (versión de PRUEBAS 1.0.${GITHUB_RUN_NUMBER}).
          - majobella.apk: app de clientas (reservar, pagar, mis citas, billetera).
          - majobella-estudio.apk: app del estudio (agenda, transferencias, clientas y dinero).
          Para instalar: abre el archivo en el celular y permite «instalar apps de este origen»."
          if gh release view app >/dev/null 2>&1; then
            gh release edit app --title "Apps MAJOBELLA 1.0.${GITHUB_RUN_NUMBER}" --notes "$NOTES"
          else
            gh release create app --title "Apps MAJOBELLA 1.0.${GITHUB_RUN_NUMBER}" --notes "$NOTES" --latest=false
          fi
          gh release upload app majobella.apk majobella-estudio.apk --clobber
