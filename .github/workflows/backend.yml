# MAJOBELLA · Backend (Supabase)
# En cada cambio de supabase/: prueba la API contra PostgreSQL y, si las pruebas pasan,
# publica la base (migraciones) y la API (Edge Function) en Supabase.
# Necesita estos secretos del repositorio (Settings → Secrets and variables → Actions):
#   SUPABASE_ACCESS_TOKEN  token personal de supabase.com/dashboard/account/tokens
#   SUPABASE_PROJECT_REF   el identificador del proyecto (lo que va antes de .supabase.co)
#   SUPABASE_DB_PASSWORD   la contraseña de la base que elegiste al crear el proyecto
# Los secretos de la API (PayPal, correo…) NO van aquí: van en Supabase → Edge Functions → Secrets.
name: Backend

on:
  push:
    branches: [main]
    paths: ['supabase/**', '.github/workflows/backend.yml']
  pull_request:
    paths: ['supabase/**', 'js/config.js', 'js/components/booking.js', 'js/integrations/booking-api.js', '.github/workflows/backend.yml']
  workflow_dispatch:

jobs:
  pruebas:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
    defaults:
      run:
        working-directory: supabase
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: sudo apt-get install -y postgresql-client
      - run: npm ci
      - name: Validar sintaxis de reservas web
        run: |
          node --check ../js/config.js
          node --check ../js/components/booking.js
          node --check ../js/integrations/booking-api.js
          node --check ../js/main.js
          node --check ../app/app.js
      - run: npm run typecheck
      - run: npm test

  publicar:
    needs: pruebas
    # Publicación explícita: integrar cambios a main NO debe migrar ni desplegar automáticamente.
    if: github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.event.head_commit.message == 'deploy-catalogo-20261022'))
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
      - name: ¿Está conectado Supabase?
        id: listo
        run: echo "ok=$([ -n "$SUPABASE_ACCESS_TOKEN" ] && [ -n "$PROJECT_REF" ] && echo si || echo no)" >> "$GITHUB_OUTPUT"
      - uses: supabase/setup-cli@v1
        if: steps.listo.outputs.ok == 'si'
        with: { version: latest }
      - name: Base de datos (migraciones)
        if: steps.listo.outputs.ok == 'si'
        run: |
          supabase link --project-ref "$PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
          supabase db push --password "$SUPABASE_DB_PASSWORD"
      - name: API (Edge Function)
        if: steps.listo.outputs.ok == 'si'
        run: supabase functions deploy api --project-ref "$PROJECT_REF" --no-verify-jwt
      - name: Aviso
        if: steps.listo.outputs.ok != 'si'
        run: echo "Supabase aún no está conectado (faltan los secretos). Las pruebas pasaron; no se publicó nada."
