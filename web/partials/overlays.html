<div class="app-ribbon" id="app-ribbon" hidden role="region" aria-label="La app MAJOBELLA">
  <img src="assets/icon-192.png" alt="" width="40" height="40">
  <p><b>La app MAJOBELLA</b><span>Tus citas a un toque.</span></p>
  <button type="button" class="btn btn-primary btn-sm" data-ribbon-install>Ver app</button>
  <button type="button" class="app-ribbon-x" aria-label="Cerrar" data-ribbon-x>×</button>
</div>

<div class="get-app" id="get-app" hidden tabindex="-1" role="dialog" aria-modal="true" aria-labelledby="ga-title"></div>

<div class="auth-modal" id="auth-modal" hidden>
  <div class="am-backdrop"></div>
  <div class="am-panel" role="dialog" aria-modal="true" aria-labelledby="auth-title">
    <button type="button" class="am-close" aria-label="Cerrar">×</button>
    <img class="am-logo" src="assets/monograma.png" alt="" width="400" height="332">
    <div id="auth-body"></div>
  </div>
</div>
<p class="toast" id="toast" role="status" hidden></p>

<div class="selection-bar" id="selection-bar" hidden role="region" aria-label="Servicios añadidos">
  <div class="sb-inner">
    <div class="sb-text">
      <p class="sb-names" id="sb-names"></p>
      <p class="sb-meta" id="sb-meta"></p>
    </div>
    <p class="sb-price" id="sb-price" aria-live="polite"></p>
    <button type="button" class="sb-clear" id="sb-clear" aria-label="Quitar todos los servicios">Vaciar</button>
    <button type="button" class="btn btn-primary" id="sb-book">Agendar estos servicios</button>
  </div>
</div>
