<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Volviendo a la app · MAJOBELLA Beauty Studio</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#ffffff">
<link rel="icon" type="image/png" href="assets/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap">
<style>
  :root { --ink: #111; --muted: #5e5e5e; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; padding: 32px 20px; background: #fff; color: var(--ink); font-family: "Source Serif 4", Georgia, serif; text-align: center; }
  main { max-width: 460px; }
  .logo { width: 170px; height: auto; display: block; margin: 0 auto 34px; }
  .k { margin: 0 0 10px; font-size: 12px; letter-spacing: .3em; text-transform: uppercase; color: var(--muted); }
  h1 { margin: 0 0 14px; font-weight: 400; font-size: clamp(30px, 7vw, 40px); line-height: 1.15; }
  p { margin: 0 0 28px; font-size: 17px; line-height: 1.6; color: #333; }
  .btn { display: inline-flex; align-items: center; justify-content: center; min-height: 52px; padding: 0 30px; background: #111; color: #fff; text-decoration: none; font-size: 15px; font-weight: 600; letter-spacing: .04em; }
  .small { margin-top: 22px; font-size: 14px; color: var(--muted); }
  .small a { color: inherit; }
</style>
</head>
<body>
<main>
  <img class="logo" src="assets/logo-majobella.png" alt="MAJOBELLA" width="340" height="120">
  <p class="k" id="k">Pago con PayPal</p>
  <h1 id="t">Volviendo a la app…</h1>
  <p id="d">Si la app no se abre sola, toca el botón. Tu pago se confirma dentro de la app.</p>
  <a class="btn" id="go" href="majobella://pago">Abrir la app MAJOBELLA</a>
  <p class="small">¿Reservaste desde la web? <a href="citas.html">Ver mis citas</a></p>
</main>
<script>
/* PayPal vuelve aquí cuando el pago se hizo desde la app (return_url / cancel_url de la orden).
   Se pasa todo a la app (majobella://pago?r=ok&token=…) para que confirme el cobro. */
(function () {
  var q = location.search || '';
  var link = 'majobella://pago' + q;
  document.getElementById('go').href = link;
  if (/[?&]r=cancel\b/.test(q)) {
    document.getElementById('t').textContent = 'Pago cancelado';
    document.getElementById('d').textContent = 'No se te cobró nada. Vuelve a la app para elegir otra forma de pago o intentarlo de nuevo.';
  }
  location.replace(link);
})();
</script>
</body>
</html>
