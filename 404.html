<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Página no encontrada · MAJOBELLA Beauty Studio</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#ffffff">
<script>
/* GitHub Pages muestra esta página en cualquier dirección que no exista: la base apunta a la raíz del sitio */
(function () {
  var parts = location.pathname.split('/');
  var base = /github\.io$/.test(location.hostname) && parts[1] ? '/' + parts[1] + '/' : '/';
  document.write('<base href="' + base + '">');
})();
</script>
<link rel="icon" type="image/png" href="assets/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap">
<style>
  :root { --ink: #111; --muted: #5e5e5e; --line: rgba(0,0,0,.14); }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; padding: 32px 20px; background: #fff; color: var(--ink); font-family: "Source Serif 4", Georgia, serif; text-align: center; }
  main { max-width: 520px; }
  .logo { width: 180px; height: auto; display: block; margin: 0 auto 36px; }
  .mono { width: 96px; height: auto; opacity: .12; display: block; margin: 0 auto 18px; }
  .k { margin: 0 0 10px; font-size: 12px; letter-spacing: .3em; text-transform: uppercase; color: var(--muted); }
  h1 { margin: 0 0 14px; font-weight: 400; font-size: clamp(32px, 7vw, 46px); line-height: 1.1; }
  p { margin: 0 0 28px; font-size: 17px; line-height: 1.6; color: #333; }
  .acts { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
  .btn { display: inline-flex; align-items: center; justify-content: center; min-height: 48px; padding: 0 26px; border: 1px solid var(--ink); text-decoration: none; font-size: 12.5px; letter-spacing: .2em; text-transform: uppercase; color: var(--ink); }
  .btn.dark { background: var(--ink); color: #fff; }
  .foot { margin-top: 40px; font-size: 13px; letter-spacing: .3em; color: var(--muted); }
</style>
</head>
<body>
<main>
  <a href="./" aria-label="MAJOBELLA, ir al inicio"><img class="logo" src="assets/logo-majobella.png" alt="MAJOBELLA Beauty Studio" width="900" height="351"></a>
  <img class="mono" src="assets/monograma.png" alt="">
  <p class="k">Error 404</p>
  <h1>Esta página no existe</h1>
  <p>Puede que el enlace esté incompleto o que la página haya cambiado de lugar. Desde aquí puedes reservar tu cita o ver las que ya tienes.</p>
  <div class="acts">
    <a class="btn dark" href="./#reservar">Reservar cita</a>
    <a class="btn" href="./#citas">Mis citas</a>
    <a class="btn" href="app/">Abrir la app</a>
  </div>
  <p class="foot">MÁS YO, MÁS BELLA.</p>
</main>
</body>
</html>
